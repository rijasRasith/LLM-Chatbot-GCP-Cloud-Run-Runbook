# Generated by: gcloud run services describe llm-chatbot --region us-central1 --format export > service.yaml
# Then edited to add startup and liveness probes under spec.template.spec.containers[0].
#
# Apply with: gcloud run services replace service.yaml --region us-central1
#
# IMPORTANT: Replace <PROJECT_ID>, <REGION>, <SA_EMAIL>, <SECRET_NAME>, and <IMAGE_URI>
# with the actual values from your deployment before applying.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: llm-chatbot
  namespace: <PROJECT_NUMBER>
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: chatbot-runtime@<PROJECT_ID>.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 60
      containers:
        - image: <IMAGE_URI>
          ports:
            - containerPort: 8080
              name: http1
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: <PROJECT_ID>
            - name: GOOGLE_CLOUD_LOCATION
              value: us-central1
            - name: GEMINI_MODEL
              value: gemini-2.5-flash
            - name: GEMINI_TIMEOUT_SECONDS
              value: "10"
            - name: MAX_RETRIES
              value: "2"
            - name: CHATBOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chatbot-api-key
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
            initialDelaySeconds: 0
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
